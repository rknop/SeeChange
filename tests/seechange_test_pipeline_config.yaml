preloads:
  - ../pipeline_config.yaml

db:
  host: postgres
  echoqueries: true
  alwaysexplain: false
  alwaysanalyze: false

conductor:
  conductor_url: https://webap:8081/
  username: admin
  password: admin

webap:
  webap_url: https://webap:8081/

pipeline:
  # Leave this at false until we update
  #   the datastore_factory.py fixture
  #   to deal with the fake objects.
  # (Possible other tests may need to
  #   be updated too.)
  # Leaving the commented-out "true"
  #   here as a reminder to make the
  #   change if you're interactively
  #   futzing around with the webap.
  inject_fakes: false
  # inject_fakes: true

# Need the sep box and filt size for historical reasons
#  (These used to be the defaults, so some test results
#   depend on them.)
extraction:
  subconfigs:
    subconfigs:
      extragalactic:
        backgrounding:
          box_size: 128
          filt_size: 3
      galactic:
        initial_threshold: 5.0
        sextr_threshold: 5.0
        snr_threshold: 10.0

subtraction:
  method: zogy
  refset: test_refset_decam    # This is needed for the pipeline_exposure_launcher test

referencing:
  coaddition:
    coaddition:
      method: zogy        # Many tests were written with this as the default

scoring:
  algorithm: RBbot-quiet-shadow-131-cut0.55

fakeinjection:
  subconfigs:
    choice_algorithm: star_density
    choice_params:
      star_mag_cutoff: 20
      star_density_cutoff: 1.0e+5
    default_subconifg: extrgalactic
    subconfigs:
      extragalactic:
        min_fake_mag: -2.
        max_fake_mag: 1.
        mag_rel_limmag: true
        num_fakes: 100
        mag_prob_ratio: 1.
        hostless_frac: 0.25
        host_minmag: -3.
        host_maxmag: 0.5
        host_distscale: 1.
        random_seed: 42
      galactic:
        min_fake_mag: -4.
        num_fakes: 400
        hostless_frac: 0.
        host_maxmag: 1.
        host_distcale: 0.
