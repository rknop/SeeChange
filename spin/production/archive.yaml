---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archive
  namespace: ls4-production
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-ls4-production-archive
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        nersc.gov/collab_uids: "103988"
        nersc.gov/gid: "103988"
        nersc.gov/gids: 10389,96414
        nersc.gov/roles: user
        nersc.gov/uid: "95089"
        nersc.gov/username: raknop
      labels:
        workload.user.cattle.io/workloadselector: deployment-ls4-production-archive
    spec:
      containers:
      - env:
        - name: CONNECTOR_READ_STORAGE
          value: /storage_ro
        - name: CONNECTOR_WRITE_STORAGE
          value: /storage
        - name: CONNECTOR_SECRETS
          value: /secrets
        image: registry.nersc.gov/m4616/file-archive-server:20260415
        imagePullPolicy: Always
        name: archive
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 95089
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /secrets
          name: file-archive-secrets
        - mountPath: /sessions
          name: file-archive-sessions
        - mountPath: /storage_ro
          name: file-archive-storage-ro
        - mountPath: /storage
          name: file-archive-storage
      dnsConfig: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 103988
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-nersc
      volumes:
      - name: file-archive-secrets
        secret:
          defaultMode: 256
          optional: false
          secretName: file-archive-secrets
      - hostPath:
          # /dvs_ro doesn't work on spin
          # path: /dvs_ro/cfs/cdirs/m4616/archive-ls4
          path: /global/cfs/cdirs/m4616/archive-ls4
          type: Directory
        name: file-archive-storage-ro
      - hostPath:
          path: /global/cfs/cdirs/m4616/archive-ls4
          type: Directory
        name: file-archive-storage
      - hostPath:
          path: /global/cfs/cdirs/m4616/seechange-deployment/production/archive_sessions
          type: Directory
        name: file-archive-sessions
---
apiVersion: v1
kind: Service
metadata:
  name: archive
  namespace: ls4-production
spec:
  clusterIP: None
  clusterIPs:
  - None
  ports:
  - name: default
    port: 42
    protocol: TCP
    targetPort: 42
  selector:
    workload.user.cattle.io/workloadselector: deployment-ls4-production-archive
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  name: archive-ingress
  namespace: ls4-production
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    workload.user.cattle.io/workloadselector: deployment-ls4-production-archive
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archive
  namespace: ls4-production
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2048m
spec:
  rules:
  - host: archive.ls4-production.production.svc.spin.nersc.org
    http:
      paths:
      - backend:
          service:
            name: archive-ingress
            port:
              number: 8080
        pathType: ImplementationSpecific
  - host: ls4-archive.lbl.gov
    http:
      paths:
      - backend:
          service:
            name: archive-ingress
            port:
              number: 8080
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - ls4-archive.lbl.gov
    secretName: ls4-archive-cert
---
